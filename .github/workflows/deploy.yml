name: CI/CD Pipeline - VietThang Fashion (AWS EC2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI JOB: Build & kiểm tra code
  # ==========================================
  ci-build:
    name: CI - Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci || npm install

      - name: 4. Build React App
        run: npm run build

  # ==========================================
  # 2. CD JOB: Tự động deploy sang AWS EC2
  # ==========================================
  cd-deploy:
    name: CD - Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Bắt đầu quá trình deploy trên AWS EC2..."
            cd ~/DevOps
            git pull origin main
            docker compose up -d --build
            docker image prune -f
            echo "✅ Deploy hoàn tất! Website đã cập nhật thành công."
