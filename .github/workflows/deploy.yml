name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/vietthang-fashion:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/vietthang-fashion:${{ github.sha }} .

      - name: 5. Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vietthang-fashion:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vietthang-fashion:${{ github.sha }}
