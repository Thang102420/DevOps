services:
  # 1. Cơ sở dữ liệu MongoDB
  mongodb:
    image: mongo:7.0
    container_name: vietthang-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=vietthang_fashion
    volumes:
      - mongo_data:/data/db

  # 2. Backend REST API Server (Node.js + Express + Mongoose)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vietthang-backend-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/vietthang_fashion
      - NODE_ENV=production
    depends_on:
      - mongodb

  # 3. Frontend Web App (Nginx + React SPA)
  vietthang-fashion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietthang-fashion-app
    restart: always
    ports:
      - "80:3000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
